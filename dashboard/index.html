<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMAN Security Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
        }
        
        .header {
            background: rgba(0,0,0,0.3);
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .header h1 {
            color: #00d4ff;
            font-size: 28px;
        }
        
        .header p {
            color: #888;
            margin-top: 5px;
        }
        
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .stat-card h3 {
            color: #888;
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .stat-card .value {
            font-size: 36px;
            font-weight: bold;
        }
        
        .stat-card.safe .value { color: #00ff88; }
        .stat-card.warning .value { color: #ffaa00; }
        .stat-card.danger .value { color: #ff4444; }
        
        .section {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .section h2 {
            color: #00d4ff;
            margin-bottom: 20px;
            font-size: 20px;
        }
        
        .scan-form {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .scan-form input {
            flex: 1;
            min-width: 200px;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 16px;
        }
        
        .scan-form select {
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 16px;
        }
        
        .scan-form button {
            padding: 15px 30px;
            border-radius: 8px;
            border: none;
            background: #00d4ff;
            color: #1a1a2e;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .scan-form button:hover {
            background: #00a8cc;
            transform: translateY(-2px);
        }
        
        .results {
            margin-top: 30px;
        }
        
        .result-item {
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #00d4ff;
        }
        
        .result-item.danger {
            border-left-color: #ff4444;
        }
        
        .result-item.warning {
            border-left-color: #ffaa00;
        }
        
        .result-item.safe {
            border-left-color: #00ff88;
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .result-title {
            font-weight: bold;
            font-size: 18px;
        }
        
        .badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .badge.danger { background: #ff4444; }
        .badge.warning { background: #ffaa00; color: #000; }
        .badge.safe { background: #00ff88; color: #000; }
        
        .result-detail {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }
        
        .api-status {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .api-status .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
        }
        
        .api-status .indicator.online {
            background: #00ff88;
        }
        
        .logs {
            max-height: 300px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 15px;
            font-family: monospace;
            font-size: 13px;
        }
        
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .log-time { color: #888; margin-right: 10px; }
        .log-info { color: #00d4ff; }
        .log-warn { color: #ffaa00; }
        .log-error { color: #ff4444; }
        
        .footer {
            text-align: center;
            padding: 30px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛡️ AMAN Security Dashboard</h1>
        <p>Vulnerability Scanner - Version 1.0.0</p>
    </div>
    
    <div class="container">
        <div class="stats">
            <div class="stat-card safe">
                <h3>Paket Aman</h3>
                <div class="value" id="safeCount">0</div>
            </div>
            <div class="stat-card warning">
                <h3>Perlu Dicek</h3>
                <div class="value" id="warningCount">0</div>
            </div>
            <div class="stat-card danger">
                <h3>Kelebihan</h3>
                <div class="value" id="dangerCount">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Paket</h3>
                <div class="value" id="totalCount">0</div>
            </div>
        </div>
        
        <div class="section">
            <h2>🔍 Scan Baru</h2>
            <form class="scan-form" id="scanForm">
                <input type="text" id="scanTarget" placeholder="URL atau Path (contoh: https://example.com atau /app)">
                <select id="scanType">
                    <option value="web">Website</option>
                    <option value="folder">Folder</option>
                    <option value="docker">Docker Image</option>
                </select>
                <button type="submit">Scan</button>
            </form>
            
            <div class="results" id="scanResults"></div>
        </div>
        
        <div class="section">
            <h2>📊 API Status</h2>
            <div class="api-status">
                <div class="indicator" id="apiIndicator"></div>
                <span id="apiStatus">Checking...</span>
            </div>
        </div>
        
        <div class="section">
            <h2>📝 Recent Activity</h2>
            <div class="logs" id="activityLog">
                <div class="log-entry">
                    <span class="log-time">[--:--:--]</span>
                    <span class="log-info">Dashboard loaded</span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        <p>AMAN Vulnerability Scanner &copy; 2024 | <a href="https://github.com/ochyx94/AMAN" style="color: #00d4ff;">GitHub</a></p>
    </div>
    
    <script>
        const API_BASE = window.location.origin;
        let activityLog = [];
        
        // Check API health
        async function checkHealth() {
            try {
                const resp = await fetch(`${API_BASE}/health`);
                if (resp.ok) {
                    document.getElementById('apiIndicator').classList.add('online');
                    document.getElementById('apiStatus').textContent = 'API Online';
                }
            } catch (e) {
                document.getElementById('apiStatus').textContent = 'API Offline - Jalankan: aman serve';
            }
        }
        
        // Add log entry
        function addLog(message, type = 'info') {
            const now = new Date();
            const time = now.toLocaleTimeString();
            activityLog.unshift({ time, message, type });
            
            const logContainer = document.getElementById('activityLog');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${time}]</span><span class="log-${type}">${message}</span>`;
            logContainer.prepend(entry);
        }
        
        // Scan form handler
        document.getElementById('scanForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const target = document.getElementById('scanTarget').value;
            const type = document.getElementById('scanType').value;
            
            if (!target) {
                alert('Masukkan target scan');
                return;
            }
            
            // Show loading
            const container = document.getElementById('scanResults');
            container.innerHTML = '<div class="result-item"><div class="result-header"><span class="result-title">Scanning...</span></div><div class="result-detail">Memindai target, harap tunggu...</div></div>';
            addLog(`Memulai scan: ${target} (${type})`, 'info');
            
            try {
                let endpoint = '';
                let body = {};
                
                if (type === 'web') {
                    // Web scan - use scan-web endpoint
                    endpoint = `${API_BASE}/api/v1/scan-web`;
                    body = { url: target, check_online: true };
                } else if (type === 'folder') {
                    // Folder scan - use scan endpoint
                    endpoint = `${API_BASE}/api/v1/scan`;
                    body = { path: target, check_online: true };
                } else {
                    // Docker - not supported via API yet
                    addLog(`Docker scan via API belum tersedia`, 'warn');
                    return;
                }
                
                const resp = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                
                if (resp.ok) {
                    const data = await resp.json();
                    displayResults(data, type);
                    addLog(`Scan selesai untuk: ${target}`, 'info');
                } else {
                    const errorText = await resp.text();
                    addLog(`Scan gagal: ${errorText}`, 'error');
                    container.innerHTML = `<div class="result-item danger"><div class="result-header"><span class="result-title">Error</span></div><div class="result-detail">${errorText}</div></div>`;
                }
            } catch (e) {
                addLog(`Scan gagal: ${e.message}`, 'error');
                container.innerHTML = `<div class="result-item danger"><div class="result-header"><span class="result-title">Error</span></div><div class="result-detail">${e.message}</div></div>`;
            }
        });
        
        // Display results
        function displayResults(data, type) {
            const container = document.getElementById('scanResults');
            
            if (type === 'web') {
                // Web scan results
                const status = data.StatusCode === 200 ? 'safe' : 'warning';
                let html = `
                    <div class="result-item ${status}">
                        <div class="result-header">
                            <span class="result-title">${data.URL}</span>
                            <span class="badge ${status}">${data.StatusCode || 'N/A'}</span>
                        </div>
                        <div class="result-detail">
                            <strong>Title:</strong> ${data.Title || 'N/A'}<br>
                            <strong>Server:</strong> ${data.Server || 'N/A'}<br>
                            <strong>Links Found:</strong> ${data.Links ? data.Links.length : 0}<br>
                            <strong>Tech Stack:</strong> ${data.TechStack ? data.TechStack.join(', ') : 'N/A'}
                        </div>
                    </div>
                `;
                container.innerHTML = html;
                
                // Update stats
                document.getElementById('safeCount').textContent = data.StatusCode === 200 ? '1' : '0';
                document.getElementById('warningCount').textContent = data.StatusCode !== 200 ? '1' : '0';
                document.getElementById('dangerCount').textContent = '0';
                document.getElementById('totalCount').textContent = '1';
            } else {
                // Folder scan results
                const vulnCount = data.vuln_count || 0;
                const packageCount = data.packages_found || 0;
                const status = vulnCount > 0 ? 'danger' : 'safe';
                
                let html = `
                    <div class="result-item ${status}">
                        <div class="result-header">
                            <span class="result-title">${data.path}</span>
                            <span class="badge ${status}">${vulnCount} Kelemahan</span>
                        </div>
                        <div class="result-detail">
                            ${packageCount} paket ditemukan | ${packageCount - vulnCount} aman
                        </div>
                    </div>
                `;
                container.innerHTML = html;
                
                // Update stats
                document.getElementById('safeCount').textContent = packageCount - vulnCount;
                document.getElementById('warningCount').textContent = '0';
                document.getElementById('dangerCount').textContent = vulnCount;
                document.getElementById('totalCount').textContent = packageCount;
            }
        }
        
        // Initial check
        checkHealth();
        setInterval(checkHealth, 30000);
    </script>
</body>
</html>
