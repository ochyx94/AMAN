<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMAN Security Dashboard</title>
<style>
:root {
  --bg: #0f1419; --card: #1a2029; --card2: #212b36; --border: #2d3743;
  --text: #e2e8f0; --muted: #8b98a8; --accent: #3b82f6;
  --critical: #dc2626; --high: #ea580c; --medium: #d97706; --low: #2563eb;
  --ok: #16a34a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0 24px; }
h1 { font-size: 22px; }
h1 span { color: var(--accent); }
.health { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--ok); }
.dot.bad { background: var(--critical); }

/* Cards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; cursor: pointer; transition: transform .1s; }
.card:hover { transform: translateY(-2px); }
.card .num { font-size: 30px; font-weight: 700; }
.card .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
.card.critical .num { color: var(--critical); }
.card.high .num { color: var(--high); }
.card.medium .num { color: var(--medium); }
.card.low .num { color: var(--low); }
.card.total .num { color: var(--accent); }

/* Panels */
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 18px; }
.panel h2 { font-size: 15px; margin-bottom: 14px; color: var(--text); display: flex; justify-content: space-between; align-items: center; }
.panel h2 .sub { font-size: 12px; color: var(--muted); font-weight: 400; }

/* Scan controls */
.scan-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
button { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
button:hover { opacity: .85; }
button:disabled { opacity: .4; cursor: not-allowed; }
button.secondary { background: var(--card2); border: 1px solid var(--border); }
#scanStatus { font-size: 13px; color: var(--muted); }
#scanStatus .running { color: var(--medium); }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 9px 10px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); }
td { padding: 9px 10px; border-bottom: 1px solid var(--border); }
tr:hover td { background: var(--card2); }
.badge { display: inline-block; padding: 2px 9px; border-radius: 10px; color: #fff; font-size: 11px; font-weight: 700; }
.sev-CRITICAL { background: var(--critical); }
.sev-HIGH { background: var(--high); }
.sev-MEDIUM { background: var(--medium); }
.sev-LOW { background: var(--low); }
.mono { font-family: ui-monospace, monospace; font-size: 12px; }
.empty { color: var(--muted); text-align: center; padding: 24px; }

/* Trend chart */
.trend { display: flex; align-items: flex-end; gap: 6px; height: 90px; padding-top: 6px; }
.trend .bar { flex: 1; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 4px; position: relative; opacity: .85; }
.trend .bar:hover { opacity: 1; }
.trend .bar .tip { display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: var(--card2); border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px; font-size: 11px; white-space: nowrap; margin-bottom: 4px; }
.trend .bar:hover .tip { display: block; }

/* Filters */
.filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.filter-btn { background: var(--card2); border: 1px solid var(--border); color: var(--muted); padding: 5px 13px; border-radius: 14px; font-size: 12px; cursor: pointer; }
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
input[type=text] { background: var(--card2); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 13px; width: 220px; }
input[type=text]:focus { outline: 1px solid var(--accent); }

/* History rows */
.hist-row { display: grid; grid-template-columns: 60px 1fr 100px 90px 90px 80px; gap: 8px; padding: 9px 10px; border-bottom: 1px solid var(--border); font-size: 13px; cursor: pointer; align-items: center; }
.hist-row:hover { background: var(--card2); }
.hist-row.active { background: var(--card2); }
.hist-row .t { color: var(--muted); }
.delta-up { color: var(--critical); font-weight: 600; }
.delta-down { color: var(--ok); font-weight: 600; }
.clickable { cursor: pointer; }
</style>
</head>
<body>
<div class="container">
<header>
  <h1>🛡️ AMAN <span>Security Dashboard</span></h1>
  <div class="health"><span class="dot" id="healthDot"></span><span id="healthText">connecting…</span></div>
</header>

<!-- Cards -->
<div class="cards" id="cards">
  <div class="card total"><div class="num" id="cTotal">–</div><div class="lbl">CVE Packages</div></div>
  <div class="card critical"><div class="num" id="cCritical">–</div><div class="lbl">Critical</div></div>
  <div class="card high"><div class="num" id="cHigh">–</div><div class="lbl">High</div></div>
  <div class="card medium"><div class="num" id="cMedium">–</div><div class="lbl">Medium</div></div>
  <div class="card low"><div class="num" id="cLow">–</div><div class="lbl">Low</div></div>
</div>

<!-- Scan control -->
<div class="panel">
  <h2>Scan <span class="sub" id="lastScanInfo"></span></h2>
  <div class="scan-row">
    <button id="btnScan" onclick="startScan()">▶ Run Full Scan</button>
    <button class="secondary" onclick="refreshAll()">↻ Refresh</button>
    <span id="scanStatus"></span>
  </div>
</div>

<!-- Trend -->
<div class="panel">
  <h2>Tren Findings <span class="sub">per scan</span></h2>
  <div class="trend" id="trend"></div>
</div>

<!-- History -->
<div class="panel">
  <h2>Riwayat Scan <span class="sub">klik untuk lihat findings</span></h2>
  <div id="history"><div class="empty">loading…</div></div>
</div>

<!-- Findings -->
<div class="panel">
  <h2>Findings <span class="sub" id="findingsTitle"></span></h2>
  <div class="filters" id="filters">
    <input type="text" id="searchBox" placeholder="Cari package / CVE / advisory…" oninput="renderFindings()">
    <span class="filter-btn active" data-sev="" onclick="setSevFilter(this)">All</span>
    <span class="filter-btn" data-sev="CRITICAL" onclick="setSevFilter(this)">Critical</span>
    <span class="filter-btn" data-sev="HIGH" onclick="setSevFilter(this)">High</span>
    <span class="filter-btn" data-sev="MEDIUM" onclick="setSevFilter(this)">Medium</span>
    <span class="filter-btn" data-sev="LOW" onclick="setSevFilter(this)">Low</span>
  </div>
  <div id="findings"><div class="empty">pilih scan dari riwayat</div></div>
</div>

</div>

<script>
const API = window.location.origin;
let allScans = [];
let currentFindings = [];
let sevFilter = '';
let selectedScan = null;
let pollTimer = null;

// ---------- health ----------
async function checkHealth() {
  const dot = document.getElementById('healthDot');
  const txt = document.getElementById('healthText');
  try {
    const r = await fetch(`${API}/health`);
    const d = await r.json();
    dot.className = 'dot ok';
    txt.textContent = `AMAN v${d.version}`;
  } catch {
    dot.className = 'dot bad';
    txt.textContent = 'offline';
  }
}

// ---------- fullscan status ----------
async function pollScanStatus() {
  try {
    const r = await fetch(`${API}/api/v1/fullscan`);
    const d = await r.json();
    const btn = document.getElementById('btnScan');
    const st = document.getElementById('scanStatus');

    if (d.running) {
      btn.disabled = true;
      st.innerHTML = `<span class="spinner"></span><span class="running">Scan berjalan… ${Math.round(d.elapsed_seconds)}s</span>`;
      if (!pollTimer) pollTimer = setInterval(pollScanStatus, 3000);
    } else {
      btn.disabled = false;
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      if (d.last_scan_id) {
        st.textContent = '';
        document.getElementById('lastScanInfo').textContent =
          `terakhir: scan #${d.last_scan_id} · ${new Date(d.last_scan_time).toLocaleString('id-ID')}`;
        refreshAll(); // results may have changed
      } else {
        st.textContent = d.message || '';
      }
    }
  } catch {}
}

async function startScan() {
  try {
    const r = await fetch(`${API}/api/v1/fullscan`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' });
    await r.json();
    pollScanStatus();
  } catch {
    alert('Gagal memulai scan');
  }
}

// ---------- history ----------
async function loadHistory() {
  const r = await fetch(`${API}/api/v1/history?limit=20`);
  const d = await r.json();
  allScans = d.scans || [];
  renderHistory();
  renderTrend();

  // auto-select latest scan if none selected
  if (!selectedScan && allScans.length > 0) {
    selectScan(allScans[0].id);
  }
}

function renderHistory() {
  const el = document.getElementById('history');
  if (!allScans.length) { el.innerHTML = '<div class="empty">Belum ada scan. Klik "Run Full Scan".</div>'; return; }
  el.innerHTML = allScans.map((s, i) => `
    <div class="hist-row ${s.id === selectedScan ? 'active' : ''}" onclick="selectScan(${s.id})">
      <span class="mono">#${s.id}</span>
      <span class="t">${new Date(s.timestamp).toLocaleString('id-ID')}</span>
      <span>${s.total_findings} CVE</span>
      <span>${s.security_issues} sec issues</span>
      <span>${s.new_count ? `<span class="delta-up">+${s.new_count} new</span>` : '<span style="color:var(--muted)">—</span>'}</span>
      <span>${s.fixed_count ? `<span class="delta-down">-${s.fixed_count} fixed</span>` : '<span style="color:var(--muted)">—</span>'}</span>
    </div>
  `).join('');
}

function renderTrend() {
  const el = document.getElementById('trend');
  if (allScans.length < 1) { el.innerHTML = '<div class="empty">belum ada data</div>'; return; }
  const scans = [...allScans].reverse(); // oldest first
  const max = Math.max(...scans.map(s => s.total_findings), 1);
  el.innerHTML = scans.map(s => `
    <div class="bar" style="height:${Math.max(4, (s.total_findings / max) * 100)}%">
      <div class="tip">#${s.id}: ${s.total_findings} CVE<br>${new Date(s.timestamp).toLocaleString('id-ID')}</div>
    </div>
  `).join('');
}

// ---------- findings ----------
async function selectScan(id) {
  selectedScan = id;
  renderHistory();
  const el = document.getElementById('findings');
  el.innerHTML = '<div class="empty">loading…</div>';
  try {
    const r = await fetch(`${API}/api/v1/findings?scan=${id}`);
    const d = await r.json();
    currentFindings = d.findings || [];
    document.getElementById('findingsTitle').textContent = `scan #${id} · ${d.total} temuan`;
    // update cards from severity summary
    const s = d.summary || {};
    document.getElementById('cTotal').textContent = d.total;
    document.getElementById('cCritical').textContent = s.CRITICAL || 0;
    document.getElementById('cHigh').textContent = s.HIGH || 0;
    document.getElementById('cMedium').textContent = s.MEDIUM || 0;
    document.getElementById('cLow').textContent = s.LOW || 0;
    renderFindings();
  } catch {
    el.innerHTML = '<div class="empty">gagal memuat findings</div>';
  }
}

function setSevFilter(btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  sevFilter = btn.dataset.sev;
  renderFindings();
}

function renderFindings() {
  const el = document.getElementById('findings');
  const q = document.getElementById('searchBox').value.toLowerCase();

  let list = currentFindings;
  if (sevFilter) list = list.filter(f => f.severity === sevFilter);
  if (q) list = list.filter(f =>
    (f.package||'').toLowerCase().includes(q) ||
    (f.cves||'').toLowerCase().includes(q) ||
    (f.advisory||'').toLowerCase().includes(q));

  if (!list.length) { el.innerHTML = '<div class="empty">tidak ada findings cocok</div>'; return; }

  // sort: severity order then package
  const order = { CRITICAL: 0, HIGH: 1, MEDIUM: 2, LOW: 3 };
  list = [...list].sort((a, b) => (order[a.severity] ?? 9) - (order[b.severity] ?? 9) || a.package.localeCompare(b.package));

  const rows = list.slice(0, 100).map(f => `
    <tr>
      <td><span class="badge sev-${f.severity}">${f.severity}</span></td>
      <td><strong>${esc(f.package)}</strong> <span class="t" style="color:var(--muted)">@ ${esc(f.installed)}</span></td>
      <td class="mono">${esc(f.fixed)}</td>
      <td class="mono">${esc(f.cves) || '—'}</td>
      <td class="mono">${esc(f.advisory)}</td>
    </tr>
  `).join('');

  el.innerHTML = `<table>
    <thead><tr><th>Severity</th><th>Package @ Installed</th><th>Fixed</th><th>CVE</th><th>Advisory</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
  ${list.length > 100 ? `<div class="empty">menampilkan 100 dari ${list.length}</div>` : ''}`;
}

function esc(s) {
  return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function refreshAll() {
  checkHealth();
  loadHistory();
}

// init
refreshAll();
pollScanStatus();
setInterval(checkHealth, 30000);
</script>
</body>
</html>
