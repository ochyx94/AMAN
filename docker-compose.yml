version: '3.8'

services:
  aman:
    build: .
    image: aman-scanner:latest
    container_name: aman-scanner
    restart: unless-stopped
    
    ports:
      - "8080:8080"
    
    volumes:
      - ./data:/opt/aman/data
      - /path/to/scan:/scan:ro
    
    environment:
      - AMAN_HOME=/opt/aman
      - AMAN_DB=/opt/aman/data/aman.db
    
    command: serve --port 8080
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    networks:
      - aman-network

  # Optional: Schedule weekly updates
  aman-updater:
    image: aman-scanner:latest
    container_name: aman-updater
    restart: no
    
    volumes:
      - ./data:/opt/aman/data
    
    environment:
      - AMAN_HOME=/opt/aman
      - AMAN_DB=/opt/aman/data/aman.db
    
    command: update --cve
    
    networks:
      - aman-network
    
    profiles:
      - updater

networks:
  aman-network:
    driver: bridge
